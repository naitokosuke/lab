packages:
  - design

catalog:
  "@chenglou/pretext": ^1.0.0
  "@tanstack/vue-virtual": ^3.13.52
  lightningcss: ^1.33.0
  tsrs: 0.22.0-ts7.1.0-beta
  valibot: ^1.5.0
  vue-router: ^5.4.0

# Each named catalog groups packages whose versions must move together.
catalogs:
  vue:
    vue: 3.6.0-rc.14
    "@vue/compiler-sfc": 3.6.0-rc.14
  vite-plus:
    vite: npm:@voidzero-dev/vite-plus-core@^1.5.0
    vite-plus: ^1.5.0
  vize:
    vize: ^0.697.0
    "@vizejs/vite-plugin": ^0.697.0

overrides:
  vite: "catalog:vite-plus"
  "@vue/compiler-sfc": "catalog:vue"

minimumReleaseAgeExclude:
  - vize
  - "@vizejs/*"
